name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kenvision-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kenvision
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kenvision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral CI secret
        run: printf 'PAYLOAD_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply schema to CI database
        run: pnpm payload migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/kenvision

      - name: Lint
        run: pnpm lint

      - name: Run unit/integration tests
        run: pnpm run test:int
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/kenvision

      - name: Build production app
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Payload migration changes
        id: migration_changes
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- src/migrations/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync application source
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env*' \
            --exclude='tests/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='coverage/' \
            --exclude='public/media/***' \
            -e "ssh -p ${DEPLOY_PORT:-22} -o StrictHostKeyChecking=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Apply database migrations
        if: steps.migration_changes.outputs.changed == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          compose() {
            docker compose --env-file .env.production -f docker-compose.prod.yml "$@"
          }
          has_dev_marker=$(compose exec -T postgres psql -U postgres -d kenvision -Atc \
            "SELECT to_regclass('public.payload_migrations') IS NOT NULL AND EXISTS (SELECT 1 FROM payload_migrations WHERE name = 'dev')")
          if [ "$has_dev_marker" = 't' ]; then
            echo 'Payload dev-mode migration marker detected; refusing to run migrations automatically.' >&2
            exit 1
          fi
          compose --profile maintenance run --rm initialize pnpm payload migrate
          REMOTE

      - name: Rebuild and restart application
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build postgres app"

      - name: Check public site
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$PRODUCTION_URL/" -o /dev/null
